# MySQL as a StatefulSet: stable identity (mysql-0) and its own persistent volume.
# (On AWS this role is played by RDS.)
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: { app: mysql }
spec:
  clusterIP: None          # headless: DNS points straight at the pod
  selector: { app: mysql }
  ports:
    - { name: mysql, port: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels: { app: mysql }
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ containerPort: 3306, name: mysql }]
          env:
            - { name: MYSQL_DATABASE, valueFrom: { configMapKeyRef: { name: dispatchx-config, key: DB_NAME } } }
            - { name: MYSQL_USER, valueFrom: { secretKeyRef: { name: dispatchx-secrets, key: DB_USER } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: dispatchx-secrets, key: DB_PASSWORD } } }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: dispatchx-secrets, key: MYSQL_ROOT_PASSWORD } } }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
