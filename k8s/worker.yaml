# Celery workers: dispatch rounds and offer timeouts. (ECS "worker" service.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do sleep 3; done"]
      containers:
        - name: worker
          image: dispatchx/backend:local
          imagePullPolicy: IfNotPresent
          args: [worker]
          envFrom:
            - configMapRef: { name: dispatchx-config }
            - secretRef: { name: dispatchx-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
