# One-off Job: run migrations and create demo accounts (riders, customers, staff).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: seed }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do sleep 3; done"]
      containers:
        - name: seed
          image: dispatchx/backend:local
          imagePullPolicy: IfNotPresent
          args: [seed, --riders, "150", --customers, "40"]
          envFrom:
            - configMapRef: { name: dispatchx-config }
            - secretRef: { name: dispatchx-secrets }
