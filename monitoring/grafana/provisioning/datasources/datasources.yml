apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
  # Uses the ECS task role in AWS (no keys). Locally it is simply unused.
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION}
