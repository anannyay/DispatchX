# Prometheus on ECS: discovers every API task through Cloud Map DNS SRV records
# (host IP + dynamic port), so new tasks are scraped automatically as the service scales.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api.dispatchx.local]
        type: SRV
        refresh_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
