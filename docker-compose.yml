# Full local stack: docker compose up --build
# App: http://localhost:3000   API docs: http://localhost:8000/api/docs   Grafana: http://localhost:3001 (admin/admin)
x-backend: &backend
  build: ./backend
  env_file: .env.local
  depends_on: &backend-dependencies
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: dispatchx
      MYSQL_USER: dispatchx
      MYSQL_PASSWORD: dispatchx
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      # The temporary init server is socket-only; require the app database over TCP.
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1 --port=3306
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"
          --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --connect-timeout=3
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    <<: *backend
    command: api
    ports: ["8000:8000"]
    volumes: [uploads:/tmp/dispatchx-uploads]
    # The API entrypoint completes migrations before starting the HTTP server.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).close()
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    <<: *backend
    command: worker
    depends_on:
      <<: *backend-dependencies
      api: { condition: service_healthy }

  beat:
    <<: *backend
    command: beat
    depends_on:
      <<: *backend-dependencies
      api: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./monitoring/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dispatchx.json
      AWS_REGION: ap-southeast-2
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

volumes:
  mysql-data:
  uploads:
