AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DispatchX bootstrap (deploy once by hand). ECR repositories for the container
  images and an S3 bucket for packaged CloudFormation templates. GitHub Actions
  authenticates with an access key held in encrypted repository secrets
  (the account's Free plan does not allow creating an OIDC identity provider).

Resources:
  BackendRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dispatchx/backend
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  WebRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dispatchx/web
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  PrometheusRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dispatchx/prometheus
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  GrafanaRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dispatchx/grafana
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-templates
            Status: Enabled
            ExpirationInDays: 30


Outputs:
  BackendRepoUri:
    Value: !GetAtt BackendRepo.RepositoryUri
    Export: { Name: dispatchx-backend-repo }
  WebRepoUri:
    Value: !GetAtt WebRepo.RepositoryUri
    Export: { Name: dispatchx-web-repo }
  PrometheusRepoUri:
    Value: !GetAtt PrometheusRepo.RepositoryUri
    Export: { Name: dispatchx-prometheus-repo }
  GrafanaRepoUri:
    Value: !GetAtt GrafanaRepo.RepositoryUri
    Export: { Name: dispatchx-grafana-repo }
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export: { Name: dispatchx-artifacts-bucket }
