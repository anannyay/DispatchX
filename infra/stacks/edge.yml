AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DispatchX edge. CloudFront is the single public entry point: HTTPS for
  users, edge caching for Next.js static assets, WebSocket pass-through for
  Socket.IO, managed security headers, and a secret origin header so the ALB
  rejects anyone who tries to bypass CloudFront.

Parameters:
  Project:
    Type: String
  AlbDnsName:
    Type: String
  OriginVerifySecret:
    Type: String
    NoEcho: true

Mappings:
  ManagedPolicies:   # AWS-managed CloudFront policy IDs (identical in every account)
    Ids:
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      AllViewer: 216adef6-5c7f-47e4-b989-5492eafa07d3
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${Project} web + API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200        # includes edge locations in India
        Origins:
          - Id: alb
            DomainName: !Ref AlbDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - { HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret }
        DefaultCacheBehavior:            # Next.js pages (server-rendered, not cached)
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [ManagedPolicies, Ids, CachingDisabled]
          OriginRequestPolicyId: !FindInMap [ManagedPolicies, Ids, AllViewer]
          ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, Ids, SecurityHeaders]
        CacheBehaviors:
          - PathPattern: /_next/static/*   # content-hashed bundles: cache at the edge for a year
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !FindInMap [ManagedPolicies, Ids, CachingOptimized]
            ResponseHeadersPolicyId: !FindInMap [ManagedPolicies, Ids, SecurityHeaders]
          - PathPattern: /api/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !FindInMap [ManagedPolicies, Ids, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [ManagedPolicies, Ids, AllViewer]
          - PathPattern: /socket.io/*      # WebSocket upgrade passes straight through
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !FindInMap [ManagedPolicies, Ids, CachingDisabled]
            OriginRequestPolicyId: !FindInMap [ManagedPolicies, Ids, AllViewer]
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
