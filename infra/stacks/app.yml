AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DispatchX compute layer. ECS cluster backed by an EC2 Auto Scaling group
  (capacity provider with managed scaling), an internet-facing ALB that only
  accepts requests carrying CloudFront's secret header, AWS WAF, Cloud Map
  service discovery, and the API / worker / beat / SQS consumer / web /
  monitoring services with auto scaling.
  (Generated from infra/src/app.template.yml by infra/src/build.py)

Parameters:
  Project:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: CommaDelimitedList
  AppSubnets:
    Type: CommaDelimitedList
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  EcsHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  ImageTag:
    Type: String
  BackendImage:
    Type: String
  WebImage:
    Type: String
  PrometheusImage:
    Type: String
  GrafanaImage:
    Type: String
  DbEndpoint:
    Type: String
  DbSecretArn:
    Type: String
  JwtSecretArn:
    Type: String
  CacheEndpoint:
    Type: String
  PodBucketName:
    Type: String
  PodBucketArn:
    Type: String
  OrderEventsTopicArn:
    Type: String
  NotifyTopicArn:
    Type: String
  DispatchQueueUrl:
    Type: String
  DispatchQueueArn:
    Type: String
  DispatchQueueName:
    Type: String
  NotifyQueueUrl:
    Type: String
  NotifyQueueArn:
    Type: String
  OriginVerifySecret:
    Type: String
    NoEcho: true
  InstanceType:
    Type: String
    Default: t3.small
  AsgMinSize:
    Type: Number
    Default: 2
  AsgMaxSize:
    Type: Number
    Default: 4
  EnableWaf:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  EcsAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id

Conditions:
  WafOn: !Equals [!Ref EnableWaf, "true"]

Resources:
  # ======================= Cluster & capacity =======================
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${Project}-cluster
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # shell access via Session Manager, no SSH/bastion

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref EcsAmi
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref EcsHostSecurityGroup]
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: !Sub "${Project}-ecs-host" }]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            cat >> /etc/ecs/ecs.config <<'EOT'
            ECS_CLUSTER=${Project}-cluster
            ECS_ENABLE_CONTAINER_METADATA=true
            ECS_CONTAINER_STOP_TIMEOUT=30s
            EOT

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref AppSubnets
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      HealthCheckType: EC2
      HealthCheckGracePeriod: 120
      Tags:
        - { Key: Name, Value: !Sub "${Project}-ecs-host", PropagateAtLaunch: true }

  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedTerminationProtection: DISABLED
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100           # add EC2 hosts only when tasks cannot be placed
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 2
          InstanceWarmupPeriod: 90

  ClusterCapacity:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }

  # ======================= Load balancer =======================
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${Project}-alb
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }     # long-lived WebSockets
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "20" }
        - { Key: stickiness.enabled, Value: "true" }              # Socket.IO long-polling fallback
        - { Key: stickiness.type, Value: lb_cookie }
        - { Key: stickiness.lb_cookie.duration_seconds, Value: "86400" }

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /login
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "20" }

  GrafanaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /grafana/api/health
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "10" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "403", ContentType: text/plain, MessageBody: "Direct access not allowed" }

  BlockMetricsRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 5
      Conditions:
        - { Field: path-pattern, PathPatternConfig: { Values: [/metrics, /metrics/*] } }
      Actions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "404", ContentType: text/plain, MessageBody: "Not found" }

  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - { Field: path-pattern, PathPatternConfig: { Values: [/api/*, /socket.io/*] } }
        - { Field: http-header, HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginVerifySecret] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref ApiTargetGroup }

  GrafanaRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - { Field: path-pattern, PathPatternConfig: { Values: [/grafana, /grafana/*] } }
        - { Field: http-header, HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginVerifySecret] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref GrafanaTargetGroup }

  WebRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 100
      Conditions:
        - { Field: http-header, HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginVerifySecret] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref WebTargetGroup }

  # ======================= WAF =======================
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafOn
    Properties:
      Name: !Sub ${Project}-waf
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "${Project}-waf" }
      Rules:
        - Name: rate-limit-per-client-ip
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 20000               # per 5 minutes; high enough for the load simulator
              AggregateKeyType: FORWARDED_IP
              ForwardedIPConfig: { HeaderName: X-Forwarded-For, FallbackBehavior: MATCH }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit }
        - Name: aws-common
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesCommonRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-common }
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-bad-inputs }
        - Name: aws-sqli
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-sqli }

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: WafOn
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  # ======================= Service discovery =======================
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: dispatchx.local
      Vpc: !Ref VpcId

  ApiDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: api
      NamespaceId: !Ref Namespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{ Type: SRV, TTL: 10 }]    # Prometheus discovers API tasks (host + dynamic port)
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  # ======================= IAM for tasks =======================
  GrafanaSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString: { PasswordLength: 20, ExcludePunctuation: true }

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DbSecretArn, !Ref JwtSecretArn, !Ref GrafanaSecret]

  AppTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dispatchx-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishEvents
                Effect: Allow
                Action: sns:Publish
                Resource: [!Ref OrderEventsTopicArn, !Ref NotifyTopicArn]
              - Sid: ConsumeQueues
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: [!Ref DispatchQueueArn, !Ref NotifyQueueArn]
              - Sid: ProofOfDelivery
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${PodBucketArn}/pod/*
              - Sid: CustomMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
              - Sid: ClusterViewRead
                Effect: Allow
                Action: [ecs:ListContainerInstances, ecs:DescribeContainerInstances, ecs:ListTasks, ecs:DescribeTasks, ecs:ListServices, ecs:DescribeServices]
                Resource: "*"
              - Sid: ClusterViewChaosStop      # only tasks in this cluster
                Effect: Allow
                Action: ecs:StopTask
                Resource: "*"
                Condition:
                  ArnEquals: { ecs:cluster: !GetAtt Cluster.Arn }
              - Sid: EcsExec
                Effect: Allow
                Action: [ssmmessages:CreateControlChannel, ssmmessages:CreateDataChannel, ssmmessages:OpenControlChannel, ssmmessages:OpenDataChannel]
                Resource: "*"

  MonitoringTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: grafana-cloudwatch-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmsForMetric
                  - logs:DescribeLogGroups
                  - logs:GetLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - tag:GetResources
                Resource: "*"

  # ======================= Logs =======================
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/${Project}/api", RetentionInDays: 7 }
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/${Project}/worker", RetentionInDays: 7 }
  BeatLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/${Project}/beat", RetentionInDays: 7 }
  ConsumerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/${Project}/consumer", RetentionInDays: 7 }
  WebLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/${Project}/web", RetentionInDays: 7 }
  MonitoringLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/${Project}/monitoring", RetentionInDays: 7 }

  # ======================= Task definitions =======================
  ApiTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-api
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AppTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub ${BackendImage}:${ImageTag}
          Command: [api]
          Essential: true
          Cpu: 256
          Memory: 768
          MemoryReservation: 384
          PortMappings: [{ ContainerPort: 8000, HostPort: 0, Protocol: tcp }]
          Ulimits: [{ Name: nofile, SoftLimit: 65536, HardLimit: 65536 }]
          StopTimeout: 30
          Environment:
            - { Name: ENVIRONMENT, Value: aws }
            - { Name: DB_HOST, Value: !Ref DbEndpoint }
            - { Name: DB_PORT, Value: "3306" }
            - { Name: DB_NAME, Value: dispatchx }
            - { Name: REDIS_URL, Value: !Sub "redis://${CacheEndpoint}:6379/0" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SNS_TOPIC_ARN, Value: !Ref OrderEventsTopicArn }
            - { Name: NOTIFY_TOPIC_ARN, Value: !Ref NotifyTopicArn }
            - { Name: SQS_DISPATCH_QUEUE_URL, Value: !Ref DispatchQueueUrl }
            - { Name: SQS_NOTIFY_QUEUE_URL, Value: !Ref NotifyQueueUrl }
            - { Name: S3_BUCKET, Value: !Ref PodBucketName }
            - { Name: CELERY_POOL, Value: threads }
            - { Name: ECS_CLUSTER, Value: !Sub "${Project}-cluster" }
            - { Name: CELERY_CONCURRENCY, Value: "8" }
            - { Name: ENABLE_CHAOS_TESTS, Value: "true" }
          Secrets:
            - { Name: DB_USER, ValueFrom: !Sub "${DbSecretArn}:username::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${DbSecretArn}:password::" }
            - { Name: JWT_SECRET, ValueFrom: !Ref JwtSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref ApiLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: api }

  WorkerTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-worker
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AppTaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub ${BackendImage}:${ImageTag}
          Command: [worker]
          Essential: true
          Cpu: 128
          Memory: 512
          MemoryReservation: 256
          StopTimeout: 30
          Environment:
            - { Name: ENVIRONMENT, Value: aws }
            - { Name: DB_HOST, Value: !Ref DbEndpoint }
            - { Name: DB_PORT, Value: "3306" }
            - { Name: DB_NAME, Value: dispatchx }
            - { Name: REDIS_URL, Value: !Sub "redis://${CacheEndpoint}:6379/0" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SNS_TOPIC_ARN, Value: !Ref OrderEventsTopicArn }
            - { Name: NOTIFY_TOPIC_ARN, Value: !Ref NotifyTopicArn }
            - { Name: SQS_DISPATCH_QUEUE_URL, Value: !Ref DispatchQueueUrl }
            - { Name: SQS_NOTIFY_QUEUE_URL, Value: !Ref NotifyQueueUrl }
            - { Name: S3_BUCKET, Value: !Ref PodBucketName }
            - { Name: CELERY_POOL, Value: threads }
            - { Name: ECS_CLUSTER, Value: !Sub "${Project}-cluster" }
            - { Name: CELERY_CONCURRENCY, Value: "8" }
            - { Name: ENABLE_CHAOS_TESTS, Value: "true" }
          Secrets:
            - { Name: DB_USER, ValueFrom: !Sub "${DbSecretArn}:username::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${DbSecretArn}:password::" }
            - { Name: JWT_SECRET, ValueFrom: !Ref JwtSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref WorkerLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: worker }

  BeatTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-beat
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AppTaskRole.Arn
      ContainerDefinitions:
        - Name: beat
          Image: !Sub ${BackendImage}:${ImageTag}
          Command: [beat]
          Essential: true
          Cpu: 64
          Memory: 256
          MemoryReservation: 128
          Environment:
            - { Name: ENVIRONMENT, Value: aws }
            - { Name: DB_HOST, Value: !Ref DbEndpoint }
            - { Name: DB_PORT, Value: "3306" }
            - { Name: DB_NAME, Value: dispatchx }
            - { Name: REDIS_URL, Value: !Sub "redis://${CacheEndpoint}:6379/0" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SNS_TOPIC_ARN, Value: !Ref OrderEventsTopicArn }
            - { Name: NOTIFY_TOPIC_ARN, Value: !Ref NotifyTopicArn }
            - { Name: SQS_DISPATCH_QUEUE_URL, Value: !Ref DispatchQueueUrl }
            - { Name: SQS_NOTIFY_QUEUE_URL, Value: !Ref NotifyQueueUrl }
            - { Name: S3_BUCKET, Value: !Ref PodBucketName }
            - { Name: CELERY_POOL, Value: threads }
            - { Name: ECS_CLUSTER, Value: !Sub "${Project}-cluster" }
            - { Name: CELERY_CONCURRENCY, Value: "8" }
            - { Name: ENABLE_CHAOS_TESTS, Value: "true" }
          Secrets:
            - { Name: DB_USER, ValueFrom: !Sub "${DbSecretArn}:username::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${DbSecretArn}:password::" }
            - { Name: JWT_SECRET, ValueFrom: !Ref JwtSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref BeatLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: beat }

  ConsumerTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-consumer
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AppTaskRole.Arn
      ContainerDefinitions:
        - Name: consumer
          Image: !Sub ${BackendImage}:${ImageTag}
          Command: [consumer]
          Essential: true
          Cpu: 128
          Memory: 384
          MemoryReservation: 192
          StopTimeout: 30
          Environment:
            - { Name: ENVIRONMENT, Value: aws }
            - { Name: DB_HOST, Value: !Ref DbEndpoint }
            - { Name: DB_PORT, Value: "3306" }
            - { Name: DB_NAME, Value: dispatchx }
            - { Name: REDIS_URL, Value: !Sub "redis://${CacheEndpoint}:6379/0" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: SNS_TOPIC_ARN, Value: !Ref OrderEventsTopicArn }
            - { Name: NOTIFY_TOPIC_ARN, Value: !Ref NotifyTopicArn }
            - { Name: SQS_DISPATCH_QUEUE_URL, Value: !Ref DispatchQueueUrl }
            - { Name: SQS_NOTIFY_QUEUE_URL, Value: !Ref NotifyQueueUrl }
            - { Name: S3_BUCKET, Value: !Ref PodBucketName }
            - { Name: CELERY_POOL, Value: threads }
            - { Name: ECS_CLUSTER, Value: !Sub "${Project}-cluster" }
            - { Name: CELERY_CONCURRENCY, Value: "8" }
            - { Name: ENABLE_CHAOS_TESTS, Value: "true" }
          Secrets:
            - { Name: DB_USER, ValueFrom: !Sub "${DbSecretArn}:username::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${DbSecretArn}:password::" }
            - { Name: JWT_SECRET, ValueFrom: !Ref JwtSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref ConsumerLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: consumer }

  WebTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-web
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub ${WebImage}:${ImageTag}
          Essential: true
          Cpu: 128
          Memory: 512
          MemoryReservation: 256
          PortMappings: [{ ContainerPort: 3000, HostPort: 0, Protocol: tcp }]
          Environment:
            - { Name: PORT, Value: "3000" }
            - { Name: HOSTNAME, Value: 0.0.0.0 }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref WebLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: web }

  MonitoringTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-monitoring
      NetworkMode: bridge
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt MonitoringTaskRole.Arn
      ContainerDefinitions:
        - Name: prometheus
          Image: !Sub ${PrometheusImage}:${ImageTag}
          Essential: true
          Cpu: 128
          Memory: 512
          MemoryReservation: 256
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref MonitoringLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: prometheus }
        - Name: grafana
          Image: !Sub ${GrafanaImage}:${ImageTag}
          Essential: true
          Cpu: 128
          Memory: 384
          MemoryReservation: 192
          Links: [prometheus]
          PortMappings: [{ ContainerPort: 3000, HostPort: 0, Protocol: tcp }]
          Environment:
            - { Name: GF_SERVER_ROOT_URL, Value: "http://localhost:3000/grafana/" }
            - { Name: GF_SERVER_SERVE_FROM_SUB_PATH, Value: "true" }
            - { Name: GF_AUTH_ANONYMOUS_ENABLED, Value: "true" }
            - { Name: GF_AUTH_ANONYMOUS_ORG_ROLE, Value: Viewer }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
          Secrets:
            - { Name: GF_SECURITY_ADMIN_PASSWORD, ValueFrom: !Ref GrafanaSecret }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref MonitoringLogs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: grafana }

  # ======================= Services =======================
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [ApiRule, ClusterCapacity]
    Properties:
      ServiceName: api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDef
      DesiredCount: 2
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
      HealthCheckGracePeriodSeconds: 120
      LoadBalancers: [{ ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup }]
      ServiceRegistries: [{ RegistryArn: !GetAtt ApiDiscovery.Arn, ContainerName: api, ContainerPort: 8000 }]
      PlacementStrategies:
        - { Type: spread, Field: attribute:ecs.availability-zone }
        - { Type: spread, Field: instanceId }
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      EnableExecuteCommand: true
      PropagateTags: SERVICE

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn: [ClusterCapacity]
    Properties:
      ServiceName: worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDef
      DesiredCount: 1
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      EnableExecuteCommand: true

  BeatService:      # exactly one scheduler, ever: stop the old one before starting the new one
    Type: AWS::ECS::Service
    DependsOn: [ClusterCapacity]
    Properties:
      ServiceName: beat
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BeatTaskDef
      DesiredCount: 1
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  ConsumerService:
    Type: AWS::ECS::Service
    DependsOn: [ClusterCapacity]
    Properties:
      ServiceName: consumer
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ConsumerTaskDef
      DesiredCount: 1
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      EnableExecuteCommand: true

  WebService:
    Type: AWS::ECS::Service
    DependsOn: [WebRule, ClusterCapacity]
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WebTaskDef
      DesiredCount: 2
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
      HealthCheckGracePeriodSeconds: 60
      LoadBalancers: [{ ContainerName: web, ContainerPort: 3000, TargetGroupArn: !Ref WebTargetGroup }]
      PlacementStrategies:
        - { Type: spread, Field: attribute:ecs.availability-zone }
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  MonitoringService:
    Type: AWS::ECS::Service
    DependsOn: [GrafanaRule, ClusterCapacity]
    Properties:
      ServiceName: monitoring
      Cluster: !Ref Cluster
      TaskDefinition: !Ref MonitoringTaskDef
      DesiredCount: 1
      CapacityProviderStrategy: [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
      HealthCheckGracePeriodSeconds: 120
      LoadBalancers: [{ ContainerName: grafana, ContainerPort: 3000, TargetGroupArn: !Ref GrafanaTargetGroup }]
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  # ======================= Auto scaling =======================
  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${ApiService.Name}
      MinCapacity: 2
      MaxCapacity: 8

  ApiCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: api-cpu-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleOutCooldown: 60
        ScaleInCooldown: 180
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

  ConsumerScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${ConsumerService.Name}
      MinCapacity: 1
      MaxCapacity: 4

  ConsumerQueueScaling:   # classic "scale workers on queue depth" pattern
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: consumer-sqs-backlog
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ConsumerScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 20
        ScaleOutCooldown: 60
        ScaleInCooldown: 120
        CustomizedMetricSpecification:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Dimensions: [{ Name: QueueName, Value: !Ref DispatchQueueName }]
          Statistic: Average

  WorkerScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${WorkerService.Name}
      MinCapacity: 1
      MaxCapacity: 3

  WorkerCpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: worker-cpu-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref WorkerScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

Outputs:
  ClusterName:
    Value: !Ref Cluster
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  AlbFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
  ApiTargetGroupFullName:
    Value: !GetAtt ApiTargetGroup.TargetGroupFullName
  WebTargetGroupFullName:
    Value: !GetAtt WebTargetGroup.TargetGroupFullName
  ApiTaskDefinitionArn:
    Value: !Ref ApiTaskDef
  CapacityProviderName:
    Value: !Ref CapacityProvider
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  GrafanaSecretArn:
    Value: !Ref GrafanaSecret
